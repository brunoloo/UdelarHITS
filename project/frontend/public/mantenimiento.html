<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UdelarHITS — Sitio en mantenimiento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      color: #1a1a2e;
      padding: 1.5rem;
    }
    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      padding: 3rem 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: .75rem; }
    p  { font-size: 1rem; line-height: 1.6; color: #555; }
    p + p { margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔧</div>
    <h1>Estamos en mantenimiento</h1>
    <p>UdelarHITS no está disponible temporalmente mientras realizamos tareas de mantenimiento programado.</p>
    <p>Volvemos pronto. Gracias por tu paciencia.</p>
  </div>
</body>
</html>
