<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UdelarHITS</title>

    <!-- SEO -->
    <meta name="description" content="Foro universitario de la Universidad de la República (Uruguay). Discusiones, preguntas y comunidad estudiantil para compartir conocimiento." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://udelarhits.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="UdelarHITS" />
    <meta property="og:description" content="Foro universitario de la Universidad de la República (Uruguay). Discusiones, preguntas y comunidad estudiantil." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://udelarhits.com/" />
    <meta property="og:image" content="https://udelarhits.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="UdelarHITS" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Antes de cualquier CSS o JS. Solo fonts.gstatic lleva crossorigin: las fuentes se piden con CORS. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Sin JS las fuentes se cargan de forma normal. -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap"
      />
    </noscript>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon-rounded.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tema y fuentes antes del primer paint, sin defer ni async. El CSP autoriza este bloque por su hash (script-src en backend/src/app.js): si se edita, hay que recalcularlo. -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        // 'system' o sin valor → resolver por el SO (claro/oscuro), igual que antes.
        // Cualquier otro valor ('light', 'dark' o una paleta como 'rosa') pasa
        // directo: dataset.theme es setAttribute, no parsea HTML, así que un valor
        // basura no inyecta nada — a lo sumo no matchea ningún bloque de tokens.css
        // y el CSS cae a :root (tema claro). Por eso el script NO necesita conocer
        // la lista de paletas: sumar un color no toca este bloque ni el hash CSP.
        if (!saved || saved === 'system') {
          document.documentElement.dataset.theme =
            window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          document.documentElement.dataset.theme = saved;
        }

        var f = document.createElement('link');
        f.rel = 'stylesheet';
        f.href = 'https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap';
        f.media = 'print';
        f.onload = function () { this.media = 'all'; };
        document.head.appendChild(f);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
